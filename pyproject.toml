[project]
name = "schemacraft"
version = "0.2.0"
description = "Turn a database into a Minecraft city."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Till Oscar Jacob", email = "to_jacob@me.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "nbtlib>=2.0.4",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
duckdb = ["duckdb>=1.1"]

[project.scripts]
schemacraft = "schemacraft.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.2",
    "pytest>=9.1.1",
]
